name: CookHub CI

on:
  pull_request:
    branches: [main, recipe]
  push:
    branches: [main, recipe]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cookhub-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate CookHub
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: recipehub
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: recipehub/.node-version
          cache: npm
          cache-dependency-path: recipehub/package-lock.json
      - name: Install production dependencies
        run: npm ci --omit=dev
      - name: Check code, templates and references
        run: npm run check
      - name: Audit production dependencies
        run: npm run audit:production
