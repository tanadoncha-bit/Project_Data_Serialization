name: Sync Render Deployment

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cookhub-production-deployment
  cancel-in-progress: false

jobs:
  report:
    name: Verify live Render revision
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: recipehub/.node-version
      - name: Report verified production deployment
        run: node recipehub/scripts/reportDeployment.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
